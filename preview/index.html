<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIX · 更新后的逐帧预览</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#eee4d4;color:#241826;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
main{width:min(100vw,1676px);margin:0 auto}
.scene{position:relative;width:100%;aspect-ratio:1676/939;overflow:hidden;isolation:isolate;background:#f3e6d4}
.scene img{position:absolute;display:block;user-select:none;pointer-events:none}
.bg,.others{inset:0;width:100%;height:100%}
.others,.seated{mix-blend-mode:multiply}
.seated{left:0;top:28.754%;width:37.47%;height:62.407%}
.headline{position:absolute;left:7%;top:17%;max-width:45%;color:#f8ead3;pointer-events:none}
.headline small{font-size:clamp(10px,1.25vw,20px);letter-spacing:.3em}
.headline h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(28px,4.2vw,74px);font-weight:400;line-height:1.14;margin:1.2rem 0}
.hit{position:absolute;left:18%;top:35%;width:22%;height:57%;border:0;background:transparent;cursor:pointer;font-size:0}
.hit:focus-visible{outline:3px solid #fff;outline-offset:-4px}
.bar{display:flex;align-items:center;gap:14px;padding:14px 18px;min-height:66px;background:#f4e8d8}
button.play{appearance:none;background:#4e1a41;color:white;border:0;border-radius:999px;padding:10px 18px;font:inherit;cursor:pointer}
button.play:disabled{opacity:.55;cursor:wait}
#status{font-size:14px;color:#574b52}
.info{margin-left:auto;font-size:13px;color:#746970}
@media(max-width:650px){.headline{top:8%;left:5%}.headline h1{margin:.4rem 0}.info{display:none}.bar{padding:10px}.hit{left:14%;width:29%;top:28%;height:66%}}
</style>
</head>
<body>
<main>
<section class="scene" aria-label="三位女性的拼贴场景">
  <img class="bg" src="../public/media/background.webp" width="1676" height="939" alt="">
  <img class="others" src="../public/media/leaning.webp" width="1676" height="939" alt=""><img class="others" src="../public/media/walker.webp" width="1676" height="939" alt="">
  <img id="seated" class="seated" src="../public/media/seated/frame_000.webp" width="628" height="586" alt="坐着的女性">
  <div class="headline"><small>SIX · 一场价值投资实验</small><h1>与年轻的创业家<br>一起冒险</h1></div>
  <button class="hit" id="person" type="button" aria-label="播放左侧女性站起的逐帧动作">播放动作</button>
</section>
<div class="bar">
  <button class="play" id="play" type="button">播放左侧人物动作</button>
  <span id="status" role="status">点击左侧人物或按钮播放</span>
  <span class="info">52 张 WebP · 12 帧/秒 · 点击后加载</span>
</div>
</main>
<script>
const count=52,fps=12;
const image=document.getElementById('seated');
const button=document.getElementById('play');
const hit=document.getElementById('person');
const status=document.getElementById('status');
let frames=null,loading=null,playing=false,raf=0;
const path=i=>`../public/media/seated/frame_${String(i).padStart(3,'0')}.webp`;
async function loadFrames(){
  if(frames)return frames;
  if(loading)return loading;
  button.disabled=true;status.textContent='正在加载动作图片…';
  loading=(async()=>{
    const result=Array(count);
    let next=0;
    async function worker(){
      while(next<count){
        const i=next++;
        const item=new Image();
        await new Promise((resolve,reject)=>{item.onload=resolve;item.onerror=()=>reject(new Error(path(i)));item.src=path(i)});
        result[i]=item;
      }
    }
    await Promise.all(Array.from({length:6},worker));
    await Promise.all(result.slice(0,8).map(item=>item.decode?.().catch(()=>{})??Promise.resolve()));
    frames=result;return result;
  })();
  try{return await loading}finally{loading=null;button.disabled=false}
}
async function play(){
  if(playing)return;
  try{await loadFrames()}catch(err){status.textContent=`加载失败：${err.message}`;return}
  cancelAnimationFrame(raf);playing=true;status.textContent='正在播放';
  image.src=frames[0].src;
  const started=performance.now();let shown=0;
  function tick(now){
    if(!playing)return;
    const index=Math.min(count-1,Math.floor((now-started)*fps/1000));
    if(index!==shown){shown=index;image.src=frames[index].src;frames[Math.min(index+3,count-1)]?.decode?.().catch(()=>{})}
    if(index<count-1){raf=requestAnimationFrame(tick)}
    else{playing=false;status.textContent='动作结束 · 点击可重播'}
  }
  raf=requestAnimationFrame(tick);
}
button.addEventListener('click',play);hit.addEventListener('click',play);
</script>
</body>
</html>
